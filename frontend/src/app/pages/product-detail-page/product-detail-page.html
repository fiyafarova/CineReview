<section class="container-custom">
  <button class="btn-back" (click)="goBack()">← Back to shopping</button>

  @if (product) {
    <div class="product-detail-grid">
      <div class="detail-image-box modern-card">
        <img [src]="product.image" [alt]="product.name">
      </div>

      <div class="detail-info-box">
        <span class="category-label">{{ product.category.name }}</span>
        <h1>{{ product.name }}</h1>

        <div class="price-tag">{{ product.price | number:'1.0-0' }} $</div>

        <div class="status-indicator" [class.out-of-stock]="!product.inStock">
          {{ product.inStock ? 'In stock' : 'Sold out' }}
        </div>

        <div class="description-block">
          <h3>Description</h3>
          <p>{{ product.description }}</p>
        </div>

        <div class="actions-row">
          <button class="btn-primary btn-lg" (click)="addToCart()" [disabled]="!product.inStock">
            Add to cart
          </button>
        </div>
      </div>
    </div>
  }
</section>
